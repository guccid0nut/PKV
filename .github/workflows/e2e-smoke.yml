name: MCP E2E Smoke Tests

on:
  push:
    branches: ['*']
    paths:
      - 'src/tools/kongor-cli/**'
      - 'tests/e2e/mcp/**'
      - '.github/workflows/e2e-smoke.yml'
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
    paths:
      - 'src/tools/kongor-cli/**'
      - 'tests/e2e/mcp/**'
      - '.github/workflows/e2e-smoke.yml'
  workflow_dispatch:

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: false
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  GITHUB_ACTIONS: 'true'
  KONGOR_MCP_RATE_LIMIT_DISABLED: '1'

jobs:
  mcp-e2e-smoke:
    name: MCP E2E Smoke
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          dotnet-quality: 'ga'
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore .NET Tools
        run: dotnet tool restore

      - name: Restore Solution Packages
        run: dotnet restore ProjectKongor.slnx -v minimal

      - name: Build Solution (Release)
        run: dotnet build ProjectKongor.slnx -c Release --no-restore -v minimal

      - name: Build Kongor CLI (Debug for E2E Process Client)
        run: dotnet build src/tools/kongor-cli/Kongor.Cli.csproj -c Debug --no-restore -v minimal

      - name: Run MCP E2E Smoke Tests
        run: |
          dotnet test tests/e2e/mcp/Kongor.Mcp.E2E.Tests.csproj -c Release --no-build `
            --logger "trx;LogFileName=mcp-e2e-smoke.trx" `
            --filter "Category!=Manual" `
            -v normal

      - name: Upload Test Results & Logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-e2e-smoke-results
          path: |
            TestResults/
            logs/
            **/*.trx
          if-no-files-found: ignore
          retention-days: 14
