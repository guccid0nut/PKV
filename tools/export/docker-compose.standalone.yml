services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:25432:5432"
    environment:
      POSTGRES_USER: merrick
      POSTGRES_DB: merrick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merrick -d merrick"]
      interval: 2s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:8.1-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:28398:6379"
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1"]

volumes:
  pgdata:
