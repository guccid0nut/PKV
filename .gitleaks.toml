targetRules = ["generic-api-key"]
paths = [
    '''(?:^|[\\/])src[\\/]apps[\\/]willowmaker[\\/]ViewModels[\\/]DirectPlayViewModel\.cs$''',
    '''(?:^|[\\/])games[\\/]client[\\/](?:override|game|verify_lua)[\\/]ui[\\/]scripts[\\/]main_v2\.lua$''',
]
regexes = [
    '''b83a886a5c437ccd9ac15473fd6f1788''',
]
