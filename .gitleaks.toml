title = "Project KONGOR V Gitleaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "uri-connection-password"
description = "Database or broker connection URI containing an embedded password"
regex = '''(?i)\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|rediss?|amqp|sqlserver)://[^:/\s"'@]+:([^@\s"']{4,})@'''
secretGroup = 1
keywords = [
    "postgres://",
    "postgresql://",
    "mysql://",
    "mongodb://",
    "mongodb+srv://",
    "redis://",
    "rediss://",
    "amqp://",
    "sqlserver://",
]
  [rules.allowlist]
  description = "Ignore documentation templates and local test container placeholders"
  regexTarget = "line"
  regexes = [
      '''\[YOUR-PASSWORD\]''',
      '''<password>''',
      '''\$\{[A-Za-z0-9_]+\}''',
      '''postgres:postgres@(?:localhost|127\.0\.0\.1|postgres)''',
      '''postgres\.(?:xyzref|xyzcompany|example|\[ref\]):''',
      '''postgres\.myuser:secret123@''',
      '''://[^:/\s"'@]+:(?:password|password123|OriginalDbPass123!|pass|secret|test|testpass|changeme|\.{3}|\*{3,})@''',
      '''@(?:db\.xyzcompany\.supabase\.co|example\.com|example\.local|localhost|127\.0\.0\.1)''',
  ]

[[rules]]
id = "compel-control-token"
description = "COMPEL Dedicated Server HTTP Control-Plane Token"
regex = '''\b(compel_[A-Za-z0-9_-]{24,})\b'''
secretGroup = 1
keywords = ["compel_"]
  [rules.allowlist]
  regexTarget = "secret"
  regexes = [
      '''^compel_(?:test|dummy|example|placeholder|fake|canary|supervisor_|proxy_|worker_)[A-Za-z0-9_-]*$''',
  ]

[[rules]]
id = "cloudflare-api-token"
description = "Cloudflare API Token (cfat_*)"
regex = '''\b(cfat_[A-Za-z0-9_-]{20,})\b'''
secretGroup = 1
keywords = ["cfat_"]
  [rules.allowlist]
  regexTarget = "secret"
  regexes = [
      '''^cfat_(?:test|dummy|example|placeholder)[A-Za-z0-9_-]*$''',
  ]

[[rules]]
id = "supabase-secret-key"
description = "Supabase Secret Key (sb_secret_*)"
regex = '''\b(sb_secret_[A-Za-z0-9_-]{16,})\b'''
secretGroup = 1
keywords = ["sb_secret_"]
  [rules.allowlist]
  regexTarget = "secret"
  regexes = [
      '''^sb_secret_(?:test|dummy|example|placeholder)[A-Za-z0-9_-]*$''',
  ]

[[rules]]
id = "azure-devops-org-url"
description = "Private Azure DevOps organization git/web URL"
regex = '''(?i)(https?://dev\.azure\.com/[A-Za-z0-9_.-]+)'''
secretGroup = 1
keywords = ["dev.azure.com"]
  [rules.allowlist]
  regexTarget = "secret"
  regexes = [
      '''(?i)^https?://dev\.azure\.com/exampleorg$''',
  ]

[[allowlists]]
description = "Allowlist K2 Engine gameplay XML modifier keys, public dev seed hashes, and synthetic unit test fixtures"
paths = [
    '''(?i)\.(?:entity|effect|material|mdf|clip|anim|model|s2z|dds|tga|png|jpg|ogg|wav|mp3|pcapng)$''',
    '''(?:^|[\\/])\.gitleaks\.toml$''',
    '''(?:^|[\\/])src[\\/]services[\\/]web-ui[\\/]wwwroot[\\/]ability_metadata\.json$''',
    '''(?:^|[\\/])src[\\/]services[\\/]web-ui[\\/]wwwroot[\\/]lib[\\/]''',
    '''(?:^|[\\/])scripts[\\/]test_phase1_security_firewall\.ps1$''',
    '''(?:^|[\\/])tests[\\/]unit[\\/]tools[\\/]Kongor\.Mcp\.Tests[\\/]RepoWiseAndAutoResearchWave4Tests\.cs$''',
]
