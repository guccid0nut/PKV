#
# Project KONGOR DirectPlay STUN / TURN Relay Configuration (coturn)
# RFC 5389 STUN + RFC 5766/8656 TURN with ephemeral HMAC-SHA1 REST credentials.
#
# IMPORTANT: Do NOT hardcode static-auth-secret in this file!
# Pass --static-auth-secret=${KONGOR_TURN_SECRET} via infra/docker/docker-compose.p2p-relay.yml.

listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# Protocol hardening & RFC 5389/5766 compliance
fingerprint
lt-cred-mech
use-auth-secret
realm=p2p.kongor.local
stale-nonce=600
no-cli

# Bounded ephemeral UDP relay port range (matches docker-compose.p2p-relay.yml)
min-port=49152
max-port=49252

# Anti-SSRF & anti-amplification peer filtering (block private/loopback/CGNAT/metadata targets)
no-multicast-peers
no-loopback-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Per-user and global allocation/bandwidth limits calibrated for 10-player K2 matches
user-quota=12
total-quota=120
max-bps=2000000

# Verbose stdout logging for rapid P2P triage
log-file=stdout
simple-log
