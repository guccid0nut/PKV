apiVersion: v1
kind: Secret
metadata:
  name: kongor-host-credentials
  namespace: default
type: Opaque
stringData:
  username: "YOUR_KONGOR_USERNAME"
  password: "YOUR_KONGOR_PASSWORD"
  token: "YOUR_COMPEL_AUTH_TOKEN"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compel-k3s-server
  namespace: default
  labels:
    app: compel-k3s
spec:
  replicas: 1
  selector:
    matchLabels:
      app: compel-k3s
  template:
    metadata:
      labels:
        app: compel-k3s
    spec:
      hostAliases:
        - ip: "192.168.65.254"
          hostnames:
            - "host.k3d.internal"
            - "host.docker.internal"
            - "host.k3s.internal"
      containers:
        - name: compel-worker
          image: projectkongor/compel-dedicated:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - SYS_NICE
          env:
            - name: HOST_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kongor-host-credentials
                  key: username
            - name: HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kongor-host-credentials
                  key: password
            - name: COMPEL_AUTHENTICATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kongor-host-credentials
                  key: token
            - name: COMPEL_FLEET_TIER
              value: "K"
            - name: Compel__FleetTier
              value: "K"
            - name: COMPEL_PORT_RANGE_OFFSET
              value: "200"
            - name: Compel__PortRangeOffset
              value: "200"
            - name: COMPEL_CONTROL_PLANE_PORT
              value: "11434"
            - name: Compel__ControlPlanePort
              value: "11434"
            - name: COMPEL_SERVER_NAME_PREFIX
              value: "^m[K3S] ^oKONGOR ARENA ^r"
            - name: COMPEL_LOCATION
              value: "USE"
            - name: COMPEL_INSTANCES
              value: "2"
            - name: COMPEL_USE_PROXY
              value: "false"
            - name: Compel__UseProxy
              value: "false"
            - name: COMPEL_PRIORITY_MODE
              value: "Background"
            - name: Compel__MasterServerAddress
              value: "host.k3d.internal:55555"
            - name: MASTER_SERVER_ADDRESS
              value: "http://host.k3d.internal:55555"
            - name: COMPEL_GATEWAY
              value: "AUTO"
            - name: Compel__Gateway
              value: "AUTO"
          ports:
            - name: control-tcp
              containerPort: 11434
              protocol: TCP
            - name: ping-udp
              containerPort: 11434
              hostPort: 11434
              protocol: UDP
            - name: game-1
              containerPort: 11435
              hostPort: 11435
              protocol: UDP
            - name: game-2
              containerPort: 11436
              hostPort: 11436
              protocol: UDP
            - name: voice-1
              containerPort: 11935
              hostPort: 11935
              protocol: UDP
            - name: voice-2
              containerPort: 11936
              hostPort: 11936
              protocol: UDP
            - name: proxy-ping-udp
              containerPort: 21434
              hostPort: 21434
              protocol: UDP
            - name: proxy-1
              containerPort: 21435
              protocol: UDP
            - name: proxy-2
              containerPort: 21436
              protocol: UDP
            - name: proxy-voice-1
              containerPort: 21935
              protocol: UDP
            - name: proxy-voice-2
              containerPort: 21936
              protocol: UDP
          resources:
            requests:
              memory: "1500Mi"
              cpu: "1"
            limits:
              memory: "3500Mi"
              cpu: "4"
          volumeMounts:
            - name: server-assets
              mountPath: /app/server
              readOnly: true
            - name: shared-assets
              mountPath: /app/shared
              readOnly: true
      volumes:
        - name: server-assets
          hostPath:
            path: /opt/kongor/games/server
            type: DirectoryOrCreate
        - name: shared-assets
          hostPath:
            path: /opt/kongor/games/shared
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: compel-k3s-service
  namespace: default
  labels:
    app: compel-k3s
spec:
  type: NodePort
  selector:
    app: compel-k3s
  ports:
    - name: control-plane
      port: 11434
      targetPort: 11434
      nodePort: 31434
      protocol: TCP
    - name: ping-udp
      port: 11434
      targetPort: 11434
      protocol: UDP
    - name: game-1
      port: 11435
      targetPort: 11435
      protocol: UDP
    - name: game-2
      port: 11436
      targetPort: 11436
      protocol: UDP
    - name: voice-1
      port: 11935
      targetPort: 11935
      protocol: UDP
    - name: voice-2
      port: 11936
      targetPort: 11936
      protocol: UDP
    - name: proxy-ping-udp
      port: 21434
      targetPort: 21434
      protocol: UDP
    - name: proxy-1
      port: 21435
      targetPort: 21435
      protocol: UDP
    - name: proxy-2
      port: 21436
      targetPort: 21436
      protocol: UDP
    - name: proxy-voice-1
      port: 21935
      targetPort: 21935
      protocol: UDP
    - name: proxy-voice-2
      port: 21936
      targetPort: 21936
      protocol: UDP
