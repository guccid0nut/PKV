apiVersion: "autoscaling.agones.dev/v1"
kind: FleetAutoscaler
metadata:
  name: kongor-dedicated-autoscaler
  namespace: default
spec:
  fleetName: kongor-dedicated-fleet
  policy:
    type: Buffer
    buffer:
      bufferSize: 1
      minReplicas: 1
      maxReplicas: 2
  sync:
    type: FixedInterval
    fixedInterval:
      seconds: 5
