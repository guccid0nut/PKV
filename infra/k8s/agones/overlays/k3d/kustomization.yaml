apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: kongor-fleet-config
    behavior: merge
    literals:
      - SERVER_NAME_PREFIX=^m[K3S] ^oKONGOR ARENA ^r
      - MASTER_SERVER_HOST_PORT=host.k3d.internal:55555
      - MASTER_SERVER_URL=http://host.k3d.internal:55555

patches:
  - target:
      group: agones.dev
      version: v1
      kind: Fleet
      name: kongor-dedicated-fleet
    path: patch-fleet.yaml
