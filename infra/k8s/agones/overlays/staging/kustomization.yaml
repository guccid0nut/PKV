apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: kongor-fleet-config
    behavior: merge
    literals:
      - SERVER_NAME_PREFIX=^m[STAGING] ^oKONGOR ARENA ^r
      - MASTER_SERVER_HOST_PORT=master-server.kongor-staging.svc.cluster.local:55555
      - MASTER_SERVER_URL=http://master-server.kongor-staging.svc.cluster.local:55555

patches:
  - target:
      group: agones.dev
      version: v1
      kind: Fleet
      name: kongor-dedicated-fleet
    path: patch-fleet.yaml
  - target:
      group: autoscaling.agones.dev
      version: v1
      kind: FleetAutoscaler
      name: kongor-dedicated-autoscaler
    path: patch-autoscaler.yaml
