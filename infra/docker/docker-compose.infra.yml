services:
  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: kongor-valkey-cache
    restart: unless-stopped
    ports:
      - "28298:6379"
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1"]

  garnet:
    image: ghcr.io/microsoft/garnet:latest
    container_name: kongor-garnet-cache
    profiles:
      - legacy-garnet
    restart: unless-stopped
    ports:
      - "28299:6379"
    volumes:
      - ./garnet.conf:/app/garnet.conf:ro
    command: ["--config-import-path", "/app/garnet.conf", "--enable-vector-set-preview"]

  pyroscope:
    image: grafana/pyroscope:latest
    container_name: kongor-pyroscope
    restart: unless-stopped
    ports:
      - "4040:4040"
    environment:
      - PYROSCOPE_LOG_LEVEL=info
